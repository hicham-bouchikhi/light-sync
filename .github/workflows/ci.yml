name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # The zero-warning policy is enforced by the build itself: AnalysisMode=All
      # with TreatWarningsAsErrors means any warning already fails this step.
      - name: Build
        run: dotnet build --no-restore -c Release

      # Installing GStreamer lets the capture integration tests actually run
      # instead of skipping. They use videotestsrc, so no display, PipeWire
      # session or portal is required.
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Test
        run: dotnet test --no-build -c Release

  publish-aot:
    name: Native AOT publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Native AOT needs a C toolchain to link. Publishing in CI is what catches
      # trim and AOT problems that an ordinary build cannot see.
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish
        run: dotnet publish src/LightSync.Cli -c Release -o out

      - name: Check the binary runs
        run: ./out/light-sync --version

  desktop-package:
    name: Desktop AppImage
    # Keep this on the same image as the release build: the glibc baseline of the
    # published binary is whatever this runner links against.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          # compute-version.sh needs the commit history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install toolchain and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev \
            xvfb xauth libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libgl1

      - name: Publish
        run: dotnet publish src/LightSync.Desktop -c Release -r linux-x64 -o out/desktop

      - uses: ./.github/actions/appimagetool

      # Packaging rots silently: a missing icon, a renamed assembly or an Avalonia that
      # stops starting under AOT only shows up when the image is built and launched.
      - name: Build the AppImage
        run: |
          version=$(./scripts/compute-version.sh | sed -n 's/^version=//p')
          ./scripts/build-appimage.sh "${version}" out/desktop out/LightSync-x86_64.AppImage

      - name: Check the AppImage starts
        run: ./scripts/verify-appimage.sh out/LightSync-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-appimage
          path: out/LightSync-x86_64.AppImage
          retention-days: 7
          if-no-files-found: error
